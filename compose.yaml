services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zcloud
      POSTGRES_PASSWORD: zcloud
      POSTGRES_DB: zcloud
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zcloud']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
